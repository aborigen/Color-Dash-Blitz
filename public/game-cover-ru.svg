<svg width="800" height="470" viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="800" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A0B2E"/>
      <stop offset="1" stop-color="#0F051A"/>
    </linearGradient>
    <linearGradient id="bolt_grad" x1="400" y1="50" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4B4B"/>
      <stop offset="1" stop-color="#D81B60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="470" fill="url(#bg_grad)"/>
  
  <!-- Geometric Shards -->
  <path d="M50 50L150 100L80 180Z" fill="#00FFFF" fill-opacity="0.1" />
  <path d="M700 350L780 420L650 450Z" fill="#FF00FF" fill-opacity="0.1" />
  <path d="M100 400L200 350L50 450Z" fill="#FFD700" fill-opacity="0.1" />
  
  <!-- Central Lightning Bolt -->
  <path d="M440 40L280 250H400L390 430L550 220H430L440 40Z" fill="white" filter="url(#glow)"/>
  <path d="M440 40L280 250H400L390 430L550 220H430L440 40Z" fill="url(#bolt_grad)" fill-opacity="0.8"/>
  
  <!-- Title Text -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="white" text-anchor="middle" filter="url(#glow)" style="text-transform: uppercase; letter-spacing: 4px;">ЦВЕТНОЙ БЛИЦ</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#00FFFF" text-anchor="middle" style="text-transform: uppercase; letter-spacing: 8px; opacity: 0.8;">УЛЬТИМАТИВНЫЙ МАТЧЕР</text>
</svg>