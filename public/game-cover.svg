<svg width="800" height="470" viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect width="800" height="470" fill="#0F0F1A"/>
  
  <!-- Dynamic Gradient Glows -->
  <circle cx="150" cy="100" r="200" fill="#FF4B4B" fill-opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="370" r="250" fill="#D81B60" fill-opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Abstract Geometric "Color Shards" -->
  <rect x="100" y="300" width="40" height="40" rx="8" fill="#FFD700" fill-opacity="0.4" transform="rotate(15 100 300)" />
  <rect x="600" y="80" width="60" height="60" rx="12" fill="#00FFFF" fill-opacity="0.3" transform="rotate(-20 600 80)" />
  <circle cx="700" cy="200" r="30" fill="#00FF00" fill-opacity="0.2" />
  <path d="M50 50L90 90L50 130Z" fill="#FF00FF" fill-opacity="0.2" />
  
  <!-- The Central Blitz (Lightning Bolt) -->
  <defs>
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bolt-grad" x1="400" y1="50" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" />
      <stop offset="1" stop-color="#FF4B4B" />
    </linearGradient>
  </defs>
  
  <path 
    d="M420 50L260 250H380L372 420L532 220H412L420 50Z" 
    fill="url(#bolt-grad)" 
    filter="url(#bolt-glow)"
  >
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1;1.02;1" 
      dur="0.5s" 
      repeatCount="indefinite" 
      additive="sum" 
      pivot="400 235"
    />
  </path>
  
  <!-- Stylized Game Title -->
  <text 
    x="400" 
    y="440" 
    text-anchor="middle" 
    fill="white" 
    style="font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 48px; letter-spacing: 0.1em; text-transform: uppercase;"
  >
    COLOR DASH <tspan fill="#FF4B4B">BLITZ</tspan>
  </text>
  
  <!-- Border Accent -->
  <rect x="10" y="10" width="780" height="450" rx="20" stroke="white" stroke-opacity="0.1" stroke-width="2" />
</svg>